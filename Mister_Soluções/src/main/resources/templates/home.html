<!doctype html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Mister Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Mister Soluções</a>
        <a class="btn btn-outline-light" th:href="@{/logout}">Sair</a>
    </div>
</nav>

<main class="container py-5">
    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-4">
            <h1 class="display-5 fw-bold">Bem-vindo ao site do Mister</h1>
            <p class="fs-4">
                Olá, <span th:text="${usuarioLogado.nome}">Usuário</span>!
            </p>
            <p class="col-md-8 fs-5">
                Esta é a versão inicial contendo somente Login + Home,
                preparada para rodar localmente com MySQL, sem Docker.
            </p>
        </div>
    </div>
</main>
</body>
</html>
