<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Rápido</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle d-flex align-items-center justify-content-center vh-100">

<div class="card shadow bg-secondary text-light p-4" style="width: 320px;">
    <h5 class="card-title text-center fw-bold mb-3">Login</h5>

    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="Digite seu e-mail" required>
        </div>

        <div class="mb-3">
            <input type="password" class="form-control" id="senha" name="senha"
                   placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">Entrar</button>

        <div class="text-center">
            <a href="#" class="text-light text-decoration-none small">Esqueceu sua senha?</a>
        </div>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
